name: hoomy-private-pilot
services:
  backend:
    image: hoomy-private-pilot:local
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - hoomy-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/api/state', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  hoomy-data:
